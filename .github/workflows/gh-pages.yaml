name: Ownables SDK Demo

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  ownables:
    strategy:
      matrix:
        package:
          - antenna
          - armor
          - car
          - paint
          - potion
          - robot
          - speakers
    concurrency: ci-${{ github.ref }}-${{ matrix.package }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Cache Ownable build files
        id: cache-ownables
        uses: actions/cache@v5
        with:
          key: ownables-cargo-${{matrix.package}}
          path: |
            ownables/${{matrix.package}}/Cargo.lock
            ownables/${{matrix.package}}/target
      - name: Setup NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.10.3 --activate
      - name: Setup wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown        
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build
        env:
          CC: clang
        run: yarn ownables:build ${{ matrix.package }}
      - uses: actions/upload-artifact@v7
        with:
          name: "${{matrix.package}}"
          path: "ownables/${{matrix.package}}.zip"

  wallet:
    concurrency: ci-${{ github.ref }}
    needs: ownables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.10.3 --activate
      - name: Yarn Install
        run: yarn install --immutable
      - name: Download Ownables packages
        uses: actions/download-artifact@v8
        with:
          path: ownables
      - name: Copy Ownables packages
        run: |
          mkdir public/ownables
          cp ownables/**/*.zip public/ownables
      - name: Build
        env:
          VITE_OWNABLE_EXAMPLES_URL: /ownables
          VITE_WALLETCONNECT_PROJECT_ID: ${{ vars.WALLETCONNECT_PROJECT_ID }}
          VITE_BASE_SEPOLIA_RPC_URL: https://sepolia.base.org
          VITE_BASE_MAINNET_RPC_URL: https://mainnet.base.org
          VITE_BASE_SEPOLIA_EXPLORER_URL: https://sepolia.basescan.org
          VITE_BASE_MAINNET_EXPLORER_URL: https://basescan.org
        run: yarn build
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          folder: dist
