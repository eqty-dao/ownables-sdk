<!DOCTYPE html>
<html>
  <head>
    <style>
      html, body {
        margin: 0;
      }

      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .potion {
        height: 75vh;
        margin: 2vh auto 0;
        aspect-ratio: 1 / 1;
        position: relative;
        overflow: hidden;
        left: 3vw;
      }
      .potion img {
        position: absolute;
        top: 0;
        height: 100%;
      }
      .potion .juice-box {
        position: absolute;
        height: 53%;
        width: 32.5%;
        top: 22%;
        left: 26.3%;
      }
      .potion .juice {
        position: absolute;
        bottom: 0;
        height: 100%;
        width: 100%;
        background-color: transparent;
      }
      .in .potion .juice {
        transition: height 1s;
      }
      .potion .amount {
        position: absolute;
        right: 35.5%;
        top: 9.5%;
        color: black;
        font-size: 4vh;
        transform: skewY(22deg);
        opacity: 0.7;
        width: 6vh;
        text-align: center;
      }

      .ownable-actions {
        box-sizing: border-box;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: clamp(8px, 3vw, 16px);
        width: min(88%, 22rem);
        padding: 5px 6px 5px 14px;
        margin: 2vh auto 0;
        border: 1px solid #555060;
        border-radius: 12px;
        background: linear-gradient(153deg, #2c2b35, #1a1920 70%);
        box-shadow: 0 4px 12px #15131d38, inset 0 1px #ffffff14;
      }

      .ownable-actions button {
        box-sizing: border-box;
        min-height: 44px;
        padding: 0 clamp(12px, 4vw, 22px);
        border: 1px solid #a8be55;
        border-radius: 7px;
        background: linear-gradient(#dbed92, #b5cd62);
        color: #242b16;
        font: 700 0.875rem system-ui, sans-serif;
        cursor: pointer;
      }

      .ownable-actions button:hover {
        background: #e4f3a9;
      }

      .ownable-actions button:active {
        background: #aec45f;
      }

      .slider {
        --fill: 50%;
        appearance: none;
        display: block;
        width: 100%;
        height: 44px;
        margin: 0;
        background: transparent;
        cursor: pointer;
      }

      .slider:focus-visible,
      .ownable-actions button:focus-visible {
        outline: 2px solid #f5ccff;
        outline-offset: 2px;
      }

      .slider::-webkit-slider-runnable-track {
        height: 6px;
        border-radius: 999px;
        background: linear-gradient(to right, #e397fb var(--fill), #4d4857 var(--fill));
      }

      .slider::-moz-range-track {
        height: 6px;
        border-radius: 999px;
        background: linear-gradient(to right, #e397fb var(--fill), #4d4857 var(--fill));
      }

      .slider::-webkit-slider-thumb {
        appearance: none;
        margin-top: -6px;
        width: 18px;
        height: 18px;
        border: 2px solid #efb7ff;
        border-radius: 5px;
        background: #493153;
        box-shadow: 0 0 6px #d378ee50;
      }

      .slider::-moz-range-thumb {
        box-sizing: border-box;
        width: 18px;
        height: 18px;
        border: 2px solid #efb7ff;
        border-radius: 5px;
        background: #493153;
        box-shadow: 0 0 6px #d378ee50;
      }

      @media (max-height: 350px) {
        .potion { height: min(75vh, calc(96vh - 58px)); }
      }
    </style>
  </head>
  <body>
    <div class="potion">
      <img src="back.png">
      <div class="juice-box">
        <div class="juice"></div>
      </div>
      <img src="glass.png">
      <img src="body.png">
      <div class="amount"></div>
    </div>
    <div class="ownable-actions">
      <input type="range" class="slider" min="0" max="100" value="50" aria-label="Drink amount">
      <button id="drink-button">Drink</button>
    </div>
    <script>
      let ownable_id;
      const slider = document.querySelector(".slider");

      slider.addEventListener("input", () => {
        slider.style.setProperty("--fill", slider.value + "%");
      });

      document.getElementById("drink-button").addEventListener('click', () => consume());

      function updateTemplate(color, amt) {
        const juice = document.getElementsByClassName('juice')[0];
        juice.style.backgroundColor = color;
        juice.style.height = amt + '%';

        document.getElementsByClassName('amount')[0].textContent = amt;

        setTimeout(() => document.body.classList.add('in'), 500);
      }

      window.addEventListener("message", (event) => {
        ownable_id = event.data.ownable_id;
        const state = event.data.state;
        updateTemplate(state.color, state.current_amount)
      });

      function consume() {
        let msg = {
          "drink": {
            "amount": slider.valueAsNumber,
          },
        };

        window.parent.postMessage({type: "execute", ownable_id, msg}, "*");
      }
    </script>
  </body>
</html>
