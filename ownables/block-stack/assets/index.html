<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Block Stack</title>
    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        color: #34333a;
      }

      .widget {
        position: relative;
        aspect-ratio: 4 / 3;
        inline-size: min(100vw, 133.33vh);
        margin-inline: auto;
        container-type: size;
      }

      .tower {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .cube {
        --unit: 8.15cqh;
        position: absolute;
        left: calc(50% - var(--unit) / 2 + var(--offset) * var(--unit));
        bottom: calc(max(21%, 56px) + var(--level) * var(--unit) * .965);
        width: var(--unit);
        height: var(--unit);
        transform: rotateX(-17deg) rotateY(var(--turn));
        transform-style: preserve-3d;
      }

      .face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
      }

      .front {
        transform: translateZ(calc(var(--unit) / 2));
        background: var(--color);
      }

      .right {
        transform: rotateY(90deg) translateZ(calc(var(--unit) / 2));
        background: color-mix(in srgb, var(--color), #232039 24%);
      }

      .top {
        transform: rotateX(90deg) translateZ(calc(var(--unit) / 2));
        background: color-mix(in srgb, var(--color), white 29%);
      }

      .controls {
        position: absolute;
        inset: auto 0 4.2%;
        display: flex;
        justify-content: center;
        gap: 8px;
      }

      button {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        color: inherit;
        border: 1px solid #dedde3;
        border-radius: 12px;
        background: transparent;
        cursor: pointer;
      }

      button:hover:not(:disabled) { background: #f1f0f5; }

      button:focus-visible {
        outline: 2px solid #7559c1;
        outline-offset: 3px;
      }

      button:disabled {
        opacity: .32;
        cursor: default;
      }

      @media (prefers-color-scheme: dark) {
        body { color: #e4e1eb; }
        button { border-color: #56525f; }
        button:hover:not(:disabled) { background: #383440; }
      }

      svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      @container (max-height: 295px) {
        .controls { bottom: 2%; }
      }
    </style>
  </head>
  <body>
    <main class="widget" aria-label="Block Stack">
      <div class="tower" aria-hidden="true"></div>
      <div class="controls">
        <button id="stack-button" type="button" aria-label="Stack one more">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"></path></svg>
        </button>
        <button id="reset-button" type="button" aria-label="Reset">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4v5h5M4.4 9a6 6 0 1 1 1.4 5.2"></path></svg>
        </button>
      </div>
    </main>
    <script>
      const blocks = [
        { color: "#e77970", offset: -0.04, turn: -30 },
        { color: "#efa866", offset: 0.10, turn: -25 },
        { color: "#e6c35e", offset: -0.08, turn: -35 },
        { color: "#77ad82", offset: 0.04, turn: -28 },
        { color: "#63b7bc", offset: -0.10, turn: -35 },
        { color: "#7292d8", offset: 0.09, turn: -24 },
        { color: "#9d80cf", offset: -0.02, turn: -31 },
      ];
      const tower = document.querySelector(".tower");
      const stackButton = document.getElementById("stack-button");
      const resetButton = document.getElementById("reset-button");

      let ownableId = null;
      let stackedBlocks = 1;

      function render() {
        while (tower.childElementCount > stackedBlocks) {
          tower.lastElementChild.remove();
        }

        for (let level = tower.childElementCount; level < stackedBlocks; level++) {
          const { color, offset, turn } = blocks[level];
          const cube = document.createElement("div");
          cube.className = "cube";
          cube.dataset.testid = "stacked-cube";
          cube.style.setProperty("--level", String(level));
          cube.style.setProperty("--offset", String(offset));
          cube.style.setProperty("--turn", turn + "deg");
          cube.style.setProperty("--color", color);

          for (const face of ["top", "right", "front"]) {
            const surface = document.createElement("span");
            surface.className = "face " + face;
            cube.append(surface);
          }

          tower.append(cube);
        }

        stackButton.disabled = stackedBlocks === 0 || stackedBlocks === blocks.length;
        resetButton.disabled = stackedBlocks === 1;
      }

      function emitAction(action, totalBlocks) {
        if (!ownableId) return;

        window.parent.postMessage(
          {
            type: "emit",
            ownable_id: ownableId,
            msg: { [action]: { total_blocks: totalBlocks } },
          },
          "*"
        );
      }

      stackButton.addEventListener("click", () => emitAction("stack", stackedBlocks + 1));
      resetButton.addEventListener("click", () => emitAction("reset", 1));

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent || typeof event.data?.ownable_id !== "string") return;

        ownableId = event.data.ownable_id;
        const count = event.data.state?.stacked_blocks;
        if (Number.isInteger(count) && count >= 0 && count <= blocks.length) {
          stackedBlocks = count;
          render();
        }
      });

      render();
    </script>
  </body>
</html>
